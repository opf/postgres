name: Release to Docker Hub

on:
  push:
    branches:
      - main

  schedule:
    # _/postgres updates are triggered automatically every Sunday at midnight.
    # However there may be intermediate updates which are triggered manually. If
    # we're building at 2am each day, we should be fairly up-to-date.
    - cron: "0 2 * * *"

  workflow_dispatch:

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY_IMAGE: openproject/postgres

jobs:
  build:
    name: Release openproject/postgres:v${{ matrix.pg_major }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        pg_major: [16, 17, 18, 19]
        platforms: ["arm64,amd64"]
        debian_codename: ["trixie"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU for x-platform build
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: openprojectci
          password: ${{ secrets.DOCKER_HUB_OPENPROJECTCI_PAT }}

      - name: Resolve base image digest
        id: base
        env:
          BASE_NAME: postgres:${{ matrix.pg_major }}-${{ matrix.debian_codename }}
        run: |
          set -euo pipefail

          DIGEST="$(docker buildx imagetools inspect "$BASE_NAME" --format '{{.Manifest.Digest}}')"

          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve digest of $BASE_NAME (got: '$DIGEST')."
            exit 1
          fi

          cat <<EOF >> "$GITHUB_OUTPUT"
          name=$BASE_NAME
          digest=$DIGEST
          image=$BASE_NAME@$DIGEST
          EOF

      - name: Get versions
        id: versions
        env:
          PG_MAJOR: ${{ matrix.pg_major }}
          DEBIAN_CODENAME: ${{ matrix.debian_codename }}
          BASE_IMAGE: ${{ steps.base.outputs.image }}
        run: |
          set -euo pipefail

          OUTPUT="$(bin/get-versions.sh)"

          read -r postgres_version postgres_major pgvector_version pgvector_debian_version extra <<< "$OUTPUT"

          if [[ -z "$postgres_version" || \
                -z "$postgres_major" || \
                -z "$pgvector_version" || \
                -z "$pgvector_debian_version" || \
                -n "${extra:-}" ]]; then
            echo "::error::get-versions.sh must return exactly four non-empty version values."
            echo "Received: $OUTPUT"
            exit 1
          fi

          cat <<EOF >> "$GITHUB_OUTPUT"
          postgres_version=$postgres_version
          postgres_major=$postgres_major
          pgvector_version=$pgvector_version
          pgvector_debian_version=$pgvector_debian_version
          EOF

      - name: Get image tags
        id: tags
        run: |
          SHORT="${{ env.REGISTRY_IMAGE }}:${{ steps.versions.outputs.postgres_major }}"
          FULL="${{ env.REGISTRY_IMAGE }}:${{ steps.versions.outputs.postgres_version }}-pgvector-${{ steps.versions.outputs.pgvector_version }}"

          cat <<EOF >> "$GITHUB_OUTPUT"
          short=$SHORT
          full=$FULL
          short_url=https://hub.docker.com/layers/openproject/postgres/${SHORT##*:}
          full_url=https://hub.docker.com/layers/openproject/postgres/${FULL##*:}
          EOF

      # Nightly runs only rebuild when an input changed: the upstream base image
      # digest or the pgvector package version. Both are recorded as labels on
      # the published image and compared here. Pushes to main and manual runs
      # always rebuild, so changes to the Dockerfile itself get published.
      - name: Check for changes
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISHED_IMAGE: ${{ steps.tags.outputs.short }}
          BASE_DIGEST: ${{ steps.base.outputs.digest }}
          PGVECTOR_DEBIAN_VERSION: ${{ steps.versions.outputs.pgvector_debian_version }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "Triggered by '$EVENT_NAME', building unconditionally."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! CONFIG="$(docker buildx imagetools inspect "$PUBLISHED_IMAGE" --format '{{json .Image}}')"; then
            echo "Could not inspect $PUBLISHED_IMAGE, assuming it doesn't exist yet."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Single-platform images return the config directly, multi-platform
          # ones a map of platform => config. Labels are identical across platforms.
          LABELS="$(jq -c '
            if has("config") then . else (to_entries | map(select(.key | test("^linux/"))) | .[0].value) end
            | .config.Labels // {}
          ' <<< "$CONFIG")"

          PUBLISHED_BASE_DIGEST="$(jq -r '."org.opencontainers.image.base.digest" // empty' <<< "$LABELS")"
          PUBLISHED_PGVECTOR="$(jq -r '."com.openproject.pgvector.version" // empty' <<< "$LABELS")"

          echo "Base digest:     published='$PUBLISHED_BASE_DIGEST' current='$BASE_DIGEST'"
          echo "pgvector version: published='$PUBLISHED_PGVECTOR' current='$PGVECTOR_DEBIAN_VERSION'"

          if [[ "$PUBLISHED_BASE_DIGEST" == "$BASE_DIGEST" && "$PUBLISHED_PGVECTOR" == "$PGVECTOR_DEBIAN_VERSION" ]]; then
            echo "No changes, skipping build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Inputs changed, building."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push image
        id: build
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          platforms: ${{ matrix.platforms }}
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.image }}
            DEBIAN_CODENAME=${{ matrix.debian_codename }}
            PG_MAJOR=${{ steps.versions.outputs.postgres_major }}
            PGVECTOR_VERSION=${{ steps.versions.outputs.pgvector_debian_version }}
          labels: |
            org.opencontainers.image.base.name=docker.io/library/${{ steps.base.outputs.name }}
            org.opencontainers.image.base.digest=${{ steps.base.outputs.digest }}
            com.openproject.pgvector.version=${{ steps.versions.outputs.pgvector_debian_version }}
          tags: |
            ${{ steps.tags.outputs.short }}
            ${{ steps.tags.outputs.full }}

      - name: Compile step summary (skipped)
        if: success() && steps.check.outputs.build == 'false'
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ### No changes for PostgreSQL ${{ matrix.pg_major }}

          Base image \`${{ steps.base.outputs.image }}\` and pgvector \`${{ steps.versions.outputs.pgvector_debian_version }}\`
          match [\`${{ steps.tags.outputs.short }}\`](${{ steps.tags.outputs.short_url }}). Nothing was pushed.
          EOF

      - name: Compile step summary
        if: success() && steps.check.outputs.build == 'true'
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ### Published Images

          - [\`${{ steps.tags.outputs.short }}\`](${{ steps.tags.outputs.short_url }})
          - [\`${{ steps.tags.outputs.full }}\`](${{ steps.tags.outputs.full_url }})
          EOF
