name: Release to Docker Hub

on:
  push:
    branches:
      - main

  schedule:
    # upstream postgres updates are published automatically every Sunday at
    # midnight. However there may be intermediate updates which are triggered
    # manually. If we're building at 2am each day, we should be fairly
    # up-to-date.
    - cron: "0 2 * * *"

  workflow_dispatch:

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY_IMAGE: openproject/postgres

jobs:
  build:
    name: Release openproject/postgres:${{ matrix.pg_major }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        pg_major: [16, 17, 18, 19]
        platforms: ["arm64,amd64"]
        debian_codename: ["trixie"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU for x-platform build
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: openprojectci
          password: ${{ secrets.DOCKER_HUB_OPENPROJECTCI_PAT }}

      - name: Get current information
        id: current
        env:
          PG_MAJOR: ${{ matrix.pg_major }}
          DEBIAN_CODENAME: ${{ matrix.debian_codename }}
        run: |
          set -euo pipefail

          OUTPUT="$(bin/get-current.sh)"

          read -r base_digest base_name postgres_version postgres_major pgvector_version pgvector_debian_version extra <<< "$OUTPUT"

          if [[ -z "$base_digest" || \
                -z "$base_name" || \
                -z "$postgres_version" || \
                -z "$postgres_major" || \
                -z "$pgvector_version" || \
                -z "$pgvector_debian_version" || \
                -n "${extra:-}" ]]; then
            echo "::error::get-current.sh must return exactly six non-empty values."
            echo "Received: $OUTPUT"
            exit 1
          fi

          cat <<EOF >> "$GITHUB_OUTPUT"
          base_digest=$base_digest
          base_name=$base_name
          postgres_version=$postgres_version
          postgres_major=$postgres_major
          pgvector_version=$pgvector_version
          pgvector_debian_version=$pgvector_debian_version
          EOF

      - name: Get previous information
        id: previous
        continue-on-error: true
        env:
          PG_MAJOR: ${{ matrix.pg_major }}
        run: |
          set -euo pipefail

          OUTPUT="$(bin/get-previous.sh)"

          read -r base_digest pgvector_debian_version extra <<< "$OUTPUT"

          if [[ -z "$base_digest" || \
                -z "$pgvector_debian_version" || \
                -n "${extra:-}" ]]; then
            echo "::error::get-previous.sh must return exactly two non-empty values."
            echo "Received: $OUTPUT"
            exit 1
          fi

          cat <<EOF >> "$GITHUB_OUTPUT"
          base_digest=$base_digest
          pgvector_debian_version=$pgvector_debian_version
          EOF

      - name: Determine image tags
        id: tags
        run: |
          set -euo pipefail

          SHORT="${{ env.REGISTRY_IMAGE }}:${{ steps.current.outputs.postgres_major }}"
          FULL="${{ env.REGISTRY_IMAGE }}:${{ steps.current.outputs.postgres_version }}-pgvector-${{ steps.current.outputs.pgvector_version }}"

          cat <<EOF >> "$GITHUB_OUTPUT"
          short=$SHORT
          full=$FULL
          short_url=https://hub.docker.com/layers/openproject/postgres/${SHORT##*:}
          full_url=https://hub.docker.com/layers/openproject/postgres/${FULL##*:}
          EOF

      - name: Build & push image
        id: build
        if: |
          github.event_name != 'schedule' ||
          steps.previous.outcome == 'failure' ||
          steps.current.outputs.base_digest != steps.previous.outputs.base_digest ||
          steps.current.outputs.pgvector_debian_version != steps.previous.outputs.pgvector_debian_version

        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          platforms: ${{ matrix.platforms }}
          build-args: |
            BASE_IMAGE=postgres@${{ steps.current.outputs.base_digest }}
            PG_MAJOR=${{ steps.current.outputs.postgres_major }}
            PGVECTOR_VERSION=${{ steps.current.outputs.pgvector_debian_version }}
          labels: |
            org.opencontainers.image.base.name=docker.io/library/${{ steps.current.outputs.base_name }}
            org.opencontainers.image.base.digest=${{ steps.current.outputs.base_digest }}
            com.openproject.pgvector.version=${{ steps.current.outputs.pgvector_debian_version }}
          tags: |
            ${{ steps.tags.outputs.short }}
            ${{ steps.tags.outputs.full }}

      - name: Compile step summary (skipped)
        if: always() && steps.build.conclusion == 'skipped'
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ### No changes for PostgreSQL ${{ matrix.pg_major }}

          Base image \`${{ steps.current.outputs.base_digest }}\` and pgvector \`${{ steps.current.outputs.pgvector_debian_version }}\`
          match [\`${{ steps.tags.outputs.short }}\`](${{ steps.tags.outputs.short_url }}). Nothing was pushed.
          EOF

      - name: Compile step summary
        if: always() && steps.build.conclusion == 'success'
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ### Published Images

          - [\`${{ steps.tags.outputs.short }}\`](${{ steps.tags.outputs.short_url }})
          - [\`${{ steps.tags.outputs.full }}\`](${{ steps.tags.outputs.full_url }})
          EOF
