name: Release to Docker Hub

on:
  push:
    branches:
      - main

  schedule:
    # Run daily at midnight UTC
    - cron: "0 0 * * *"

  workflow_dispatch:

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: openproject/postgres

jobs:
  build:
    name: Build (version ${{ matrix.pg_major }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        pg_major: [16, 17, 18, 19]
        platforms: ["arm64,amd64"]
        debian_codename: ["trixie"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU for x-platform build
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: openprojectci
          password: ${{ secrets.DOCKER_HUB_OPENPROJECTCI_PAT }}

      - name: Get versions
        id: versions
        env:
          PG_MAJOR: ${{ matrix.pg_major }}
          DEBIAN_CODENAME: ${{ matrix.debian_codename }}
        run: |
          set -euo pipefail

          OUTPUT="$(bin/get-versions.sh)"

          read -r postgres_version postgres_major pgvector_version pgvector_debian_version extra <<< "$OUTPUT"

          if [[ -z "$postgres_version" || \
                -z "$postgres_major" || \
                -z "$pgvector_version" || \
                -z "$pgvector_debian_version" || \
                -n "${extra:-}" ]]; then
            echo "::error::get-versions.sh must return exactly four non-empty version values."
            echo "Received: $OUTPUT"
            exit 1
          fi

          cat <<EOF >> "$GITHUB_OUTPUT"
          postgres_version=$postgres_version
          postgres_major=$postgres_major
          pgvector_version=$pgvector_version
          pgvector_debian_version=$pgvector_debian_version
          EOF

      - name: Get image tags
        id: tags
        run: |
          SHORT="${{ env.REGISTRY_IMAGE }}:${{ steps.versions.outputs.postgres_major }}"
          FULL="${{ env.REGISTRY_IMAGE }}:${{ steps.versions.outputs.postgres_version }}-pgvector-${{ steps.versions.outputs.pgvector_version }}"

          cat <<EOF >> "$GITHUB_OUTPUT"
          short=$SHORT
          full=$FULL
          short_url=https://hub.docker.com/layers/openproject/postgres/${SHORT##*:}
          full_url=https://hub.docker.com/layers/openproject/postgres/${FULL##*:}
          EOF

      - name: Build & push image
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          platforms: ${{ matrix.platforms }}
          build-args: |
            DEBIAN_CODENAME=${{ matrix.debian_codename }}
            PG_MAJOR=${{ steps.versions.outputs.postgres_major }}
            PGVECTOR_VERSION=${{ steps.versions.outputs.pgvector_debian_version }}
          tags: |
            ${{ steps.tags.outputs.short }}
            ${{ steps.tags.outputs.full }}


      - name: Compile step summary
        if: success()
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ### Published Images

          - [\`${{ steps.tags.outputs.short }}\`](${{ steps.tags.outputs.short_url }})
          - [\`${{ steps.tags.outputs.full }}\`](${{ steps.tags.outputs.full_url }})
          EOF
